<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Home Page{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            color-scheme: dark;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #0b1020;
            color: #e7edf8;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(ellipse at top, #1a2945 0, #10182b 42%, #0b1020 78%);
            color: #e7edf8;
            line-height: 1.6;
        }

        header {
            padding: 2rem 1.5rem 1.5rem;
            text-align: center;
            background: rgba(12, 19, 35, 0.78);
            border-bottom: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
        }

        h1 {
            margin: 0 0 1rem;
            color: #f8fafc;
            font-size: clamp(2rem, 5vw, 3rem);
            letter-spacing: 0.04em;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        nav a {
            padding: 0.6rem 1rem;
            color: #dbeafe;
            text-decoration: none;
            background: #17243b;
            border: 1px solid #2b3c59;
            border-radius: 999px;
            transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
        }

        nav a:hover, nav a:focus-visible {
            color: #fff;
            background: #2563eb;
            border-color: #60a5fa;
            transform: translateY(-2px);
            outline: none;
        }

        hr {
            height: 1px;
            margin: 0;
            border: 0;
            background: linear-gradient(90deg, transparent, #334766, transparent);
        }

        main {
            width: min(1100px, calc(100% - 2rem));
            min-height: 55vh;
            margin: 2.5rem auto;
        }

        footer {
            padding: 1.25rem;
            color: #94a3b8;
            text-align: center;
            border-top: 1px solid rgba(148, 163, 184, 0.16);
            background: rgba(8, 13, 25, 0.65);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Laptop Store</h1>
        <nav>
            <a href="/login">Sign In</a>
            <a href="/products">View Products</a>
            <a href="/about">About Us</a>
        </nav>
    </header>
    <hr>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        @Copyright. All Rights Reserved
    </footer>

</body>
</html>
