<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #dfe9f3);
            color: #1f2937;
        }

        .cart-box {
            width: min(520px, 90%);
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
            padding: 40px 30px;
            text-align: center;
            border: 1px solid #e5e7eb;
        }

        .success-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e8f9ee;
            color: #1f9d5a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 2rem;
            color: #111827;
        }

        p {
            margin: 0;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #374151;
        }
    </style>
</head>
<body>
    <div class="cart-box">
        <div class="success-icon">✓</div>
        <h1>My Cart</h1>
        <p>Product added to cart successfully!</p>
    </div>
</body>
</html>
