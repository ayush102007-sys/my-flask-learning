{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<style>
    .login-page {
        min-height: 100vh;
        padding: 32px 20px;
        box-sizing: border-box;
        background: #111;
        color: #f5f5f5;
        font-family: Arial, sans-serif;
    }

    .login-page header {
        margin-bottom: 28px;
        color: #ddd;
        font-size: 1.1rem;
        text-align: center;
    }

    .login-page main {
        max-width: 420px;
        margin: 0 auto;
        padding: 30px;
        border: 1px solid #333;
        border-radius: 12px;
        background: #1b1b1b;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .login-page h2 {
        margin: 0 0 24px;
        text-align: center;
    }

    .login-page form > div {
        margin-bottom: 18px;
    }

    .login-page label {
        display: block;
        margin-bottom: 7px;
        color: #ddd;
    }

    .login-page input[type="text"],
    .login-page input[type="password"] {
        width: 100%;
        padding: 11px 12px;
        box-sizing: border-box;
        border: 1px solid #444;
        border-radius: 6px;
        background: #101010;
        color: #fff;
    }

    .login-page input:focus {
        outline: 2px solid #888;
        outline-offset: 1px;
    }

    .login-page input[type="submit"] {
        width: 100%;
        padding: 11px;
        border: 0;
        border-radius: 6px;
        background: #eee;
        color: #111;
        font-weight: bold;
        cursor: pointer;
    }

    .login-page input[type="submit"]:hover {
        background: #ccc;
    }
</style>

<div class="login-page">
    <header>
        Authentication Page
    </header>

    <main>
        <h2>Login Here</h2>
        <form action="/submit" method="post">
            <div>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter Username" required>
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Password" required>
            </div>

            <div>
                <input type="submit" value="Login">
            </div>
        </form>
    </main>
</div>

{% endblock %}
