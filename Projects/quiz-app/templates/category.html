{% extends "base.html" %}

{% block title %}Quiz Category Page{% endblock %}

{% block content %}

<style>
    .category-page {
        width: min(100% - 2rem, 720px);
        margin: 0 auto;
        padding: 1.5rem 0 3rem;
    }

    .category-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 2rem;
    }

    .category-header a {
        display: inline-block;
        padding: 0.55rem 0.9rem;
        border: 1px solid rgba(127, 127, 127, 0.4);
        border-radius: 6px;
        background: var(--bs-primary, #0d6efd);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        transition: filter 0.2s ease, transform 0.2s ease;
    }

    .category-header a:hover,
    .category-header a:focus-visible {
        filter: brightness(0.92);
        transform: translateY(-1px);
    }

    .username-placeholder {
        padding: 0.55rem 0.9rem;
        border: 1px solid rgba(127, 127, 127, 0.3);
        border-radius: 999px;
        background: rgba(127, 127, 127, 0.1);
        font-weight: 600;
    }

    .category-card {
        padding: clamp(1.5rem, 5vw, 2.5rem);
        border: 1px solid rgba(127, 127, 127, 0.3);
        border-radius: 12px;
        background: var(--bs-body-bg, Canvas);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .category-card h1 {
        margin: 0 0 1.5rem;
        text-align: center;
    }

    .category-form label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
    }

    .category-form select,
    .category-form input[type="submit"] {
        width: 100%;
        min-height: 2.75rem;
        padding: 0.65rem 0.8rem;
        border: 1px solid rgba(127, 127, 127, 0.5);
        border-radius: 6px;
        font: inherit;
    }

    .category-form select {
        margin-bottom: 1.25rem;
        background: var(--bs-body-bg, Canvas);
        color: inherit;
    }

    .category-form input[type="submit"] {
        border: 0;
        background: var(--bs-primary, #0d6efd);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
    }

    .category-form input[type="submit"]:hover {
        filter: brightness(0.92);
    }

    .category-form select:focus-visible,
    .category-form input[type="submit"]:focus-visible {
        outline: 3px solid rgba(13, 110, 253, 0.35);
        outline-offset: 2px;
    }
</style>

<div class="category-page">
    <header class="category-header">
        <nav aria-label="Main navigation">
            <a href="/home">Home</a>
        </nav>
        <span class="username-placeholder">Welcome, <b>{{ name }}</b></span>
</header>

<main class="category-card">
    <h1>Select a Topic</h1>

    <form class="category-form" action="/quiz" method="post">
    <div>
        <label for="topics">Select a category</label>
        <select name="topics" id="topics">

            <option value="select" selected disabled>See Categories</option>
            {% for key in lst.keys() %}
            <option value="{{ key }}">{{ key }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div>
        <input type="submit" value="Start Quiz">
    </div>
    </form>
</main>
</div>
{% endblock %}
