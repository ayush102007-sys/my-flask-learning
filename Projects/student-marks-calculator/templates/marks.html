{% extends "base.html" %}

{% block title %}Marks Page{% endblock %}

{% block content %}
<header>
    <h2>Enter Your Marks</h2>
</header>

<main>
  <form action="/calculate" method="post">
    <div>
      <label for="maths">Mathematics Marks</label>
      <input type="text" name="maths" id="maths" required>
    </div>

    <div>
      <label for="phy">Physics Marks</label>
      <input type="text" name="phy" id="phy" required>
    </div>

    <div>
      <label for="cs">COMS Marks</label>
      <input type="text" name="cs" id="cs" required>
    </div>

    <div>
      <input type="submit" value="Submit Marks">
    </div>
  </form>

</main>

{% endblock %}
