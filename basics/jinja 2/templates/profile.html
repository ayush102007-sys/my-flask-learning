<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
</head>

<body>
    <h1>Welcome {{ name }}</h1>
    {% if is_topper %}
    <p>You are a Topper</p>
    {% else %}
    <p>You need to work hard</p>
    {% endif %}

    <ul>
        {% for subject in subjects %}
        <li>{{subject}}</li>
        {% endfor %}
    </ul>
</body>

</html>
